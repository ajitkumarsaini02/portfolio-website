<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Dark Cyber Rounded Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Left Bracket < (Cyan) -->
  <path d="M 18 21 L 10 32 L 18 43" fill="none" stroke="#22D3EE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letter A (Bright Pure White) -->
  <path d="M 23 43 L 29 21 L 35 43" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="25.5" y1="36.5" x2="32.5" y2="36.5" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" />

  <!-- Slash / (Vibrant Purple) -->
  <line x1="39" y1="43" x2="44" y2="21" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" />

  <!-- Right Bracket > (Vibrant Purple) -->
  <path d="M 46 21 L 54 32 L 46 43" fill="none" stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
